name: CI

on:
  workflow_dispatch:
  pull_request:
    branches-ignore:
      - 'bump/**'
    paths-ignore:
      - 'README.md'
      - 'image/**'
  push:
    branches:
      ['main']
    paths-ignore:
      - 'README.md'
      - 'image/**'
jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'jetbrains'
        cache: 'gradle'
    - name: Build with Gradle
      run: ./gradlew app:assembleDebug

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'jetbrains'
          cache: 'gradle'
      - name: Build with Gradle
        run: ./gradlew testDebugUnitTest
