name: CI

on:
  workflow_dispatch:
  pull_request:
    branches-ignore:
      - 'bump/**'
  push:
    branches:
      ['main']
    paths-ignore:
      - '.github/workflows/**'
      - 'README.md'
      - 'image/**'
      - 'CONTRIBUTING.md'
      - '.all-contributorsrc'
      - 'metadata/**'
      - 'CLAUDE.md'
      - 'LICENSE'
      - '.gitignore'
jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v6

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            app:
              - '**'
              - '!.github/workflows/**'
              - '!README.md'
              - '!image/**'
              - '!CONTRIBUTING.md'
              - '!.all-contributorsrc'
              - '!metadata/**'
              - '!CLAUDE.md'
              - '!LICENSE'
              - '!.gitignore'

  build-debug:
    name: Compile Check
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'jetbrains'
        cache: 'gradle'
    - name: Compile Kotlin sources
      run: ./gradlew :app:compileDebugKotlin

  test-unit:
    name: Unit Test
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'jetbrains'
          cache: 'gradle'
      - name: Build with Gradle
        run: ./gradlew testDebugUnitTest
